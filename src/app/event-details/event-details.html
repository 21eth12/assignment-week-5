<section class="section">
  <div class="container" style="max-width:760px">
    @if (event(); as e) {
      <a routerLink="/events" class="link">← Back to events</a>

      <div class="card" style="margin-top:14px">
        <span class="badge">{{ e.category }}</span>
        <h2 style="margin-top:10px">{{ e.title }}</h2>
        <p>{{ e.description }}</p>
        <div class="meta">📅 {{ e.date }} · 💻 {{ e.mode }} · ⏱ {{ e.duration }}</div>

        <div class="card" style="background:#f8fbfc;margin:18px 0">
          <b>Registration fee</b>
          <div class="price" style="font-size:24px">{{ e.fee }}</div>
        </div>

        <button class="btn btn-primary">Continue to registration &amp; payment →</button>
      </div>
    } @else {
      <div class="card">
        <h3>Event not found</h3>
        <a routerLink="/events" class="link">Back to events</a>
      </div>
    }
  </div>
</section>
