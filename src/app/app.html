<div class="app">
  <div class="topbar">
    <span>Young Researcher Academy · Publish · Research · Impact · Collaborate</span>
    <span>Ile-Ife, Osun State, Nigeria</span>
  </div>

  <header class="header">
    <nav class="nav">
      <a class="brand" routerLink="/">
        <div><strong>Young Researcher</strong><span>Academy</span></div>
      </a>

      <div class="navlinks">
        @for (link of navLinks; track link.path) {
          <a [routerLink]="link.path" routerLinkActive="active-link">{{ link.label }}</a>
        }
      </div>

      <div class="actions">
        <a class="btn btn-secondary" routerLink="/login">Login</a>
        <a class="btn btn-primary" routerLink="/community">Join YRA</a>
      </div>
    </nav>
  </header>

  <main>
    <router-outlet />
  </main>
</div>
